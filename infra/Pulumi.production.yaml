config:
  gcp:project: graphite-girder-509905-i2
  gcp:region: asia-southeast1
  deep:adminBootstrapEmail: admin@deep.app
  # One warm instance: a cold start (~10.7s) outlasts the iOS client's 10s request
  # timeout. CPU stays throttled between requests (cpuIdle), so it bills at the idle rate.
  deep:minInstances: 1
  # Secrets are NOT stored here in plaintext — set them encrypted per the README.
  # jwtSecret + adminBootstrapPassword were carried over from the deep-production-app
  # deployment so existing app sessions and the admin login survive the move.
  # Each deploy sets the image per build:
  #   pulumi config set deep:image asia-southeast1-docker.pkg.dev/graphite-girder-509905-i2/backend/api:<sha>

  deep:jwtSecret:
    secure: AAABACO6igD764V+gc9W3Q/+ojD26wjXFMmZm+eaf+kqM1tBMOCV8uY3z1W+Xd+T8y9V+Zsr953657lOYLD/eH6OF9LUo1p7JZfb/DlzNeXFzL+PD6ybHCsRJdjQjIwE
  deep:adminBootstrapPassword:
    secure: AAABAGAqtCgftYF7kENBUft6DwORBTY3Uj7IeixGqKPrshfQ6CHSFKILwCg1dKA03Kid/aqYPVg=
  deep:image: asia-southeast1-docker.pkg.dev/graphite-girder-509905-i2/backend/api:ffc6fbb
