# The one place a version string is written.
#
# Mirrors the rule the theme tokens follow: one source of truth, never a literal
# repeated at a call site. Verified against upstream release notes 2026-09-18.

[versions]
# AGP 9.4.0 requires Gradle 9.6+, JDK 17+, Build Tools 36.0.0, and caps at API 37.
agp = "9.4.0"

# Kotlin is NOT applied as a project plugin — AGP 9 ships built-in Kotlin support,
# so `org.jetbrains.kotlin.android` must not be applied.
#
# AGP 9.4 bundles KGP 2.2.10, and that is NOT usable here: Compose 1.12 and Coil
# 3.6 are compiled against Kotlin 2.4, and a 2.2 compiler cannot read metadata
# version 2.4.0 — it fails on `kotlin.Unit`. So the bundled version is overridden
# on the buildscript classpath in the root build file, and every Kotlin compiler
# plugin below matches this exact version.
kotlin = "2.4.20"

# The BOM pins every androidx.compose artifact; never version them individually.
composeBom = "2026.09.00"

activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.0"
splashscreen = "1.2.0"
navigationCompose = "2.9.6"

# OkHttp, not Ktor.
#
# Not because of Ktor's refresh handling, but because this app needs ONE http
# client for JSON, artwork and streamed audio. Coil ships coil-network-okhttp and
# Media3 ships media3-datasource-okhttp, so OkHttp is in the build either way —
# choosing Ktor would mean two connection pools, two DNS and TLS caches, and two
# places to attach Accept-Language, X-Device-Timezone and the dev cleartext host.
#
# It also means the single-flight refresh is ours to unit-test rather than a
# plugin's to get right, which matters: deep-api revokes the entire session when a
# refresh token is presented twice.
okhttp = "5.5.0"
retrofit = "3.0.0"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
datastore = "1.2.1"

# Week 3. Declared now so the catalog is the full picture; unused until then.
media3 = "1.11.1"

coil = "3.6.2"

# Jupiter, not JUnit 4: :core:model is a plain JVM module, so useJUnitPlatform()
# needs no extra Android plugin, and @DisplayName carries the Swift Testing
# @Test("...") strings across verbatim.
junitBom = "6.1.3"

# Deliberately absent: androidx.security:security-crypto. Jetpack Security Crypto
# and EncryptedSharedPreferences are deprecated and unmaintained, with documented
# keyset-corruption crashes and synchronous main-thread I/O. Tokens go into
# Preferences DataStore encrypted with an AndroidKeyStore AES/GCM key instead —
# the honest twin of KeychainTokenStore.swift.

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3-junit5", version.ref = "okhttp" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-datasource-okhttp = { group = "androidx.media3", name = "media3-datasource-okhttp", version.ref = "media3" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }

junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junitBom" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No kotlin-jvm alias: the KGP pin in the root build file already puts that plugin
# on the classpath, so modules apply `id("org.jetbrains.kotlin.jvm")` bare.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
